<!DOCTYPE html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffe9f4">
<title>Stafaleikur</title>
<style>
  :root{
    --bleikur:#ff5fa2; --gulur:#ffd93d; --graenn:#2ec4a6; --blar:#4d9dff;
    --fjolublar:#9b5de5; --dokkt:#2b1a4a;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:"Chalkboard SE","Comic Sans MS","Baloo 2",system-ui,sans-serif;
    color:var(--dokkt);
    background:linear-gradient(160deg,#ffe9f4 0%,#e6f3ff 45%,#e9fff4 100%);
    overflow:hidden;
    -webkit-user-select:none;user-select:none;
    touch-action:manipulation;              /* ekkert double-tap zoom á síma */
    -webkit-tap-highlight-color:transparent;
    -webkit-touch-callout:none;
  }
  #himinn{position:fixed;inset:0;pointer-events:none;z-index:0}
  .sky{position:absolute;font-size:3rem;opacity:.35;animation:sveima linear infinite}
  @keyframes sveima{from{transform:translateX(-15vw)}to{transform:translateX(115vw)}}

  /* justify-content:center + overflow klippir toppinn af á litlum skjám,
     svo teygjanleg ::before/::after miðja efnið í staðinn */
  .skjar{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;
    align-items:center;justify-content:flex-start;gap:1rem;padding:3.6rem 1rem 1rem;text-align:center;
    overflow-y:auto}
  .skjar::before,.skjar::after{content:'';flex:1 0 0;min-height:0}
  @supports(height:100dvh){.skjar{height:100dvh}}
  .falin{display:none !important}

  h1{font-size:clamp(2.5rem,8vw,5rem);margin:0;line-height:1;
     background:linear-gradient(90deg,var(--bleikur),var(--gulur),var(--graenn),var(--blar),var(--fjolublar));
     -webkit-background-clip:text;background-clip:text;color:transparent;
     filter:drop-shadow(0 4px 0 rgba(0,0,0,.08))}
  .undirtitill{font-size:clamp(1rem,3vw,1.5rem);opacity:.7;margin:0}

  .takki{
    font:inherit;font-size:clamp(1.4rem,4vw,2.2rem);font-weight:bold;color:#fff;
    background:linear-gradient(180deg,var(--graenn),#1ba98d);
    border:none;border-radius:999px;padding:.7em 1.6em;cursor:pointer;
    box-shadow:0 8px 0 #148a73, 0 12px 24px rgba(0,0,0,.18);
    transition:transform .08s, box-shadow .08s;
  }
  .takki:active{transform:translateY(6px);box-shadow:0 2px 0 #148a73}
  .takki.blar{background:linear-gradient(180deg,var(--blar),#2b7fe0);box-shadow:0 8px 0 #2168b8,0 12px 24px rgba(0,0,0,.18)}
  .takki.blar:active{box-shadow:0 2px 0 #2168b8}

  /* ---- toppstika ---- */
  #stika{position:fixed;top:0;left:0;right:0;z-index:3;display:flex;align-items:center;
    justify-content:space-between;gap:1rem;padding:.7rem 1.1rem}
  .merki{background:#fff;border-radius:999px;padding:.35em .9em;font-size:clamp(.9rem,2.2vw,1.25rem);
    font-weight:bold;box-shadow:0 4px 12px rgba(0,0,0,.1);white-space:nowrap}
  #stigin{color:var(--fjolublar)}
  #rodin{color:var(--bleikur)}
  #framvinda{flex:1;max-width:340px;height:16px;background:#fff;border-radius:999px;overflow:hidden;
    box-shadow:inset 0 2px 4px rgba(0,0,0,.08)}
  #framvindaFyllt{height:100%;width:0%;border-radius:999px;
    background:linear-gradient(90deg,var(--gulur),var(--graenn));transition:width .35s}

  /* ---- spjaldid ---- */
  #spjald{
    background:#fff;border-radius:2.5rem;padding:.9rem 2.2rem 1.2rem;
    box-shadow:0 18px 40px rgba(0,0,0,.14);
    display:flex;flex-direction:column;align-items:center;gap:.6rem;
  }
  #mynd{font-size:clamp(4rem,15vh,8.5rem);line-height:1.1;animation:hopp 2.2s ease-in-out infinite}
  @keyframes hopp{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-14px) rotate(2deg)}}
  #mynd.rett{animation:snua .6s ease}
  @keyframes snua{0%{transform:scale(1)}40%{transform:scale(1.35) rotate(12deg)}100%{transform:scale(1)}}
  #spjald.rangt{animation:hrista .4s}
  @keyframes hrista{0%,100%{transform:translateX(0)}20%{transform:translateX(-14px)}40%{transform:translateX(14px)}60%{transform:translateX(-9px)}80%{transform:translateX(9px)}}

  #ord{display:flex;gap:.35rem;align-items:flex-end;flex-wrap:wrap;justify-content:center}
  .stafur{
    font-size:clamp(2.2rem,7vw,4rem);font-weight:bold;line-height:1;
    padding:.05em .18em;border-radius:.28em;min-width:.72em;text-align:center;
  }
  .stafur.sest{color:var(--dokkt);opacity:.55}
  .stafur.reitur{
    color:transparent;background:#f0eefc;border-bottom:.12em solid var(--fjolublar);
  }
  .stafur.reitur.naest{background:#fff3c4;border-bottom-color:var(--gulur);animation:pulsa 1.1s ease-in-out infinite}
  @keyframes pulsa{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
  .stafur.buid{color:var(--graenn);background:#ddfaf1;border-bottom-color:var(--graenn);
    animation:skella .3s ease}
  @keyframes skella{0%{transform:scale(1.6)}100%{transform:scale(1)}}
  .stafur.visbending{color:var(--bleikur) !important;background:#ffe3ef}

  #hjalp{font-size:clamp(.9rem,2.4vw,1.25rem);opacity:.65;min-height:1.6em}
  kbd{background:#efeaff;border-radius:.4em;padding:.1em .45em;font-family:inherit;
      box-shadow:0 2px 0 #d6cdf5}

  /* ---- stafatakkar ---- */
  #stafaval{display:grid;grid-template-columns:repeat(10,1fr);gap:.5rem;
    max-width:58rem;width:100%;margin-bottom:2.2rem}
  @media (max-width:900px){#stafaval{grid-template-columns:repeat(5,1fr)}}
  .stafatakki{
    font:inherit;font-weight:bold;font-size:clamp(1.6rem,4vw,2.4rem);line-height:1;
    color:#fff;border:none;border-radius:1rem;padding:.5em 0;cursor:pointer;
    box-shadow:0 6px 0 rgba(0,0,0,.22), 0 8px 18px rgba(0,0,0,.14);
    transition:transform .08s, box-shadow .08s, opacity .2s;
  }
  @media(hover:hover){.stafatakki:hover{transform:translateY(-3px)}}
  .stafatakki:active{transform:translateY(5px);box-shadow:0 1px 0 rgba(0,0,0,.22)}
  .stafatakki.rangur{opacity:.28;pointer-events:none;transform:none;box-shadow:none}
  .stafatakki.visbending{animation:pulsa .7s ease-in-out infinite;
    outline:5px solid #fff;outline-offset:3px}

  #stafaval.hastafir .stafatakki{text-transform:uppercase}
  .hastTakki{
    font:inherit;font-size:clamp(.95rem,2.4vw,1.2rem);font-weight:bold;color:var(--dokkt);
    background:#fff;border:3px solid var(--fjolublar);border-radius:999px;
    padding:.55em 1.4em;cursor:pointer;margin:-1.4rem 0 2.4rem;
    box-shadow:0 5px 0 #cbbdf0;transition:transform .08s, box-shadow .08s, background .12s;
    -webkit-user-select:none;user-select:none;touch-action:none;
  }
  .hastTakki .synid{background:#f0eafd;border-radius:.5em;padding:.1em .5em;letter-spacing:.05em;white-space:nowrap}
  .hastTakki.virkur{
    background:var(--fjolublar);color:#fff;transform:translateY(5px);box-shadow:0 0 0 #cbbdf0;
  }
  .hastTakki.virkur .synid{background:rgba(255,255,255,.25)}

  /* ---- limmidasafn ---- */
  #hilla{position:fixed;bottom:0;left:0;right:0;z-index:3;display:flex;flex-wrap:wrap;
    gap:.2rem;justify-content:center;padding:.2rem;font-size:1.4rem;pointer-events:none}
  #hilla span{animation:skella .4s ease}

  /* ---- yfirlogg ---- */
  #yfir{position:fixed;inset:0;z-index:5;background:rgba(43,26,74,.75);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4rem;
    color:#fff;text-align:center;padding:1rem}
  #yfir h2{font-size:clamp(2rem,7vw,4rem);margin:0}
  #yfir .stort{font-size:clamp(5rem,18vh,10rem);animation:hopp 1.4s ease-in-out infinite}

  /* ---- valmynd ---- */
  #leikjaval{display:flex;gap:1.4rem;flex-wrap:wrap;justify-content:center;max-width:56rem}
  .leikjaspjald{font:inherit;color:inherit;text-align:center;cursor:pointer;
    background:#fff;border:4px solid transparent;border-radius:2rem;padding:1.6rem 1.4rem;width:17rem;
    box-shadow:0 12px 28px rgba(0,0,0,.12);transition:.15s}
  @media(hover:hover){.leikjaspjald:hover{transform:translateY(-6px);border-color:var(--fjolublar)}}
  .leikjaspjald .em{font-size:2.8rem;line-height:1.2}
  .leikjaspjald .nafn{font-size:1.5rem;font-weight:bold;margin:.4rem 0 .3rem;color:var(--fjolublar)}
  .leikjaspjald .lysing{font-size:.95rem;opacity:.65;line-height:1.35}

  .flokkur{font-size:1.3rem;font-weight:bold;opacity:.55;margin-top:.3rem}
  #leikjaval2{display:flex;gap:1rem;flex-wrap:wrap;justify-content:center;max-width:56rem}
  .leikjaspjald{position:relative}
  .leikjaspjald .nr2{position:absolute;top:.6rem;left:.7rem;background:var(--fjolublar);color:#fff;
    width:1.7rem;height:1.7rem;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:.95rem;font-weight:bold}

  /* ---- leikur 4: sagan ---- */
  #stika4{position:fixed;top:0;left:0;right:0;z-index:3;display:flex;align-items:center;
    justify-content:space-between;gap:1rem;padding:.7rem 1.1rem}
  #framvinda4{flex:1;max-width:340px;height:16px;background:#fff;border-radius:999px;overflow:hidden;
    box-shadow:inset 0 2px 4px rgba(0,0,0,.08)}
  #framvindaFyllt4{height:100%;width:0%;border-radius:999px;
    background:linear-gradient(90deg,var(--gulur),var(--graenn));transition:width .35s}
  #svid{background:#fff;border-radius:2rem;padding:1.2rem 1.6rem;box-shadow:0 14px 34px rgba(0,0,0,.13);
    width:min(56rem,100%);min-height:clamp(7rem,22vh,11rem);display:flex;align-items:center;
    justify-content:center;overflow:hidden}
  #svidHlutir{display:flex;flex-wrap:wrap;gap:.25em;justify-content:center;align-items:center;
    font-size:clamp(2rem,7vh,3.6rem)}
  #svidHlutir span{display:inline-block;will-change:transform,opacity}
  .svidhopur{display:flex;flex-wrap:wrap;gap:.25em;justify-content:center;align-items:center;
    padding:.12em .25em;border-radius:.6em}
  .svidhopur.nyr{background:#e6f8ef;box-shadow:inset 0 0 0 3px #bfe9d5}
  .svidadgerd{font-weight:bold;color:var(--fjolublar);font-size:1.1em;padding:0 .15em}
  .svidpar{display:flex;align-items:center;gap:.25em;flex-wrap:wrap;justify-content:center}
  .farinn{opacity:.3;filter:grayscale(1);position:relative}
  .farinn::after{content:'✖';position:absolute;inset:0;display:flex;align-items:center;
    justify-content:center;color:var(--bleikur);font-size:.8em;opacity:.9;filter:none}
  #jafnaRod{display:flex;align-items:center;justify-content:center;gap:.9rem;min-height:2.4rem}
  #jafna{font-size:clamp(1.5rem,min(6vh,8vw),2.4rem);font-weight:bold;letter-spacing:.02em;
    white-space:nowrap}
  #jafna span{display:inline-block;margin:0 .12em;animation:skella .3s ease}
  #jafna .spurn{color:var(--bleikur)}
  #sjaAftur{font:inherit;font-size:clamp(.9rem,2.4vw,1.1rem);font-weight:bold;color:var(--fjolublar);
    background:#fff;border:3px solid var(--fjolublar);border-radius:999px;padding:.3em .9em;
    cursor:pointer;box-shadow:0 4px 0 #cbbdf0;white-space:nowrap}
  #sjaAftur:active{transform:translateY(3px);box-shadow:0 1px 0 #cbbdf0}
  #saga{font-size:clamp(1.2rem,3.4vw,1.9rem);font-weight:bold;color:var(--fjolublar);min-height:1.5em}
  #hjalp4{font-size:clamp(1rem,2.6vw,1.35rem);opacity:.7;min-height:1.6em}
  #tolur4{display:grid;grid-template-columns:repeat(auto-fit,minmax(3.4rem,1fr));gap:.5rem;
    max-width:52rem;width:100%;margin-bottom:2.4rem}

  @keyframes birtast{from{transform:scale(0) rotate(-25deg);opacity:0}
                     60%{transform:scale(1.25) rotate(8deg);opacity:1}
                     to{transform:scale(1);opacity:1}}
  @keyframes koma{from{transform:translateX(70vw) scale(.4);opacity:0}
                  to{transform:none;opacity:1}}
  @keyframes springaAnim{0%{transform:scale(1)}35%{transform:scale(1.6)}
                         100%{transform:scale(2.4);opacity:0}}
  @keyframes bordaAnim{0%{transform:scale(1)}45%{transform:scale(.55) rotate(25deg)}
                       100%{transform:scale(0) rotate(-15deg);opacity:0}}
  @keyframes burtAnim{to{transform:translateX(70vw) translateY(-25vh) rotate(25deg);opacity:0}}
  @keyframes hverfaAnim{to{transform:scale(.15) rotate(380deg);opacity:0}}
  /* afmarkað við sviðið svo .burt rekist ekki á krossuðu hlutina í Teldu hlutina */
  #svidHlutir .birtast{animation:birtast .45s cubic-bezier(.34,1.56,.64,1) backwards}
  #svidHlutir .koma   {animation:koma 1s cubic-bezier(.22,1,.36,1) backwards}
  #svidHlutir .springa{animation:springaAnim .8s ease-in forwards}
  #svidHlutir .borda  {animation:bordaAnim .8s ease-in forwards}
  #svidHlutir .burt   {animation:burtAnim 1s ease-in forwards}
  #svidHlutir .hverfa {animation:hverfaAnim .9s ease-in forwards}

  /* ---- leikur 3: staerdfraedi ---- */
  #stika3{position:fixed;top:0;left:0;right:0;z-index:3;display:flex;align-items:center;
    justify-content:space-between;gap:1rem;padding:.7rem 1.1rem}
  #framvinda3{flex:1;max-width:340px;height:16px;background:#fff;border-radius:999px;overflow:hidden;
    box-shadow:inset 0 2px 4px rgba(0,0,0,.08)}
  #framvindaFyllt3{height:100%;width:0%;border-radius:999px;
    background:linear-gradient(90deg,var(--gulur),var(--graenn));transition:width .35s}
  #daemispjald{background:#fff;border-radius:2rem;padding:1.1rem 2.2rem 1.3rem;text-align:center;
    box-shadow:0 14px 34px rgba(0,0,0,.13);max-width:56rem}
  #daemispjald.rangt{animation:hrista .4s}
  #daemiMyndir{display:flex;align-items:center;justify-content:center;gap:.5rem;flex-wrap:wrap;
    font-size:clamp(1.6rem,5vh,2.8rem);margin-bottom:.4rem}
  #daemiMyndir .hopur{display:flex;gap:.12em;flex-wrap:wrap;justify-content:center;max-width:16em}
  #daemiMyndir .adgerd{font-weight:bold;color:var(--fjolublar);font-size:1.1em;padding:0 .2em}
  #daemiMyndir .burt{opacity:.28;position:relative;filter:grayscale(1)}
  #daemiMyndir .burt::after{content:'✖';position:absolute;inset:0;display:flex;align-items:center;
    justify-content:center;color:var(--bleikur);font-size:.9em;opacity:.9;filter:none}
  #daemiTexti{font-size:clamp(1.8rem,min(9vh,10vw),4.4rem);font-weight:bold;line-height:1.1;letter-spacing:.03em;white-space:nowrap}
  #daemiTexti .spurn{color:var(--bleikur)}
  #hjalp3{font-size:clamp(1rem,2.6vw,1.35rem);opacity:.7;min-height:1.6em}
  #tolur{display:grid;grid-template-columns:repeat(auto-fit,minmax(3.4rem,1fr));gap:.5rem;
    max-width:52rem;width:100%;margin-bottom:2.4rem}
  .tolutakki{
    font:inherit;font-weight:bold;font-size:clamp(1.5rem,4vw,2.2rem);line-height:1;color:#fff;
    border:none;border-radius:1rem;padding:.5em 0;cursor:pointer;
    box-shadow:0 6px 0 rgba(0,0,0,.22),0 8px 18px rgba(0,0,0,.14);
    transition:transform .08s,box-shadow .08s,opacity .2s}
  @media(hover:hover){.tolutakki:hover{transform:translateY(-3px)}}
  .tolutakki:active{transform:translateY(5px);box-shadow:0 1px 0 rgba(0,0,0,.22)}
  .tolutakki.rangur{opacity:.28;pointer-events:none;transform:none;box-shadow:none}
  .tolutakki.rett3{animation:snua .6s ease;outline:5px solid #fff;outline-offset:3px}

  /* ---- leikur 2 ---- */
  #stika2{position:fixed;top:0;left:0;right:0;z-index:3;display:flex;align-items:center;
    justify-content:space-between;gap:1rem;padding:.7rem 1.1rem}
  #framvinda2{flex:1;max-width:340px;height:16px;background:#fff;border-radius:999px;overflow:hidden;
    box-shadow:inset 0 2px 4px rgba(0,0,0,.08)}
  #framvindaFyllt2{height:100%;width:0%;border-radius:999px;
    background:linear-gradient(90deg,var(--gulur),var(--graenn));transition:width .35s}
  #stafspjald{background:#fff;border-radius:2rem;padding:.6rem 2.6rem 1rem;text-align:center;
    box-shadow:0 14px 34px rgba(0,0,0,.13)}
  #storiStafur{font-size:clamp(5rem,16vh,9rem);font-weight:bold;line-height:1.05;
    background:linear-gradient(180deg,var(--fjolublar),var(--bleikur));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  #stafspjald.ordham{padding:1.2rem 2rem 1.4rem}
  #stafspjald.ordham #storiStafur{font-size:clamp(2.2rem,min(10vh,11vw),4.6rem);letter-spacing:.04em}
  #stafspjald.ordham #baedi{display:none}
  #baedi{font-size:1.3rem;opacity:.45;letter-spacing:.3em}
  #hjalp2{font-size:clamp(1rem,2.6vw,1.35rem);opacity:.7;min-height:1.6em}
  #valkostir{margin-bottom:3rem;display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;max-width:56rem;width:100%}
  @media (max-width:700px){#valkostir{grid-template-columns:repeat(2,1fr)}}
  .valkostur{position:relative;background:#fff;border:4px solid transparent;border-radius:1.6rem;
    padding:1rem .4rem;cursor:pointer;font:inherit;transition:.15s;
    box-shadow:0 10px 22px rgba(0,0,0,.11)}
  @media(hover:hover){.valkostur:hover{transform:translateY(-6px);border-color:var(--blar)}}
  .valkostur .emj{font-size:clamp(3rem,9vh,5rem);line-height:1.1;display:block}
  .valkostur .nr{position:absolute;top:.5rem;left:.6rem;background:var(--fjolublar);color:#fff;
    width:1.8rem;height:1.8rem;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:1rem;font-weight:bold}
  .valkostur.rett2{border-color:var(--graenn);background:#ddfaf1;animation:snua .6s ease}
  .valkostur.rangt2{animation:hrista .4s;opacity:.4}
  .valkostur .ordtexti{font-size:1.05rem;font-weight:bold;opacity:0;transition:.2s}
  .valkostur.syna .ordtexti{opacity:.75}


  #agnir{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden}
  .agn{position:absolute;font-size:2rem;animation:falla linear forwards}
  @keyframes falla{to{transform:translateY(110vh) rotate(720deg);opacity:0}}
</style>
</head>
<body>

<div id="himinn"></div>
<div id="agnir"></div>

<!-- UPPHAFSSKJAR -->
<div class="skjar" id="upphaf">
  <div style="font-size:clamp(4rem,14vh,8rem)">🐶 🍎 ⭐</div>
  <h1>Stafaleikur</h1>
  <p class="undirtitill">Sjáðu myndina — ýttu á rétta stafinn!</p>
  <button class="takki" id="byrjaTakki">Byrja! ▶</button>
  <p class="undirtitill" style="font-size:1rem">Bilstöng <kbd>␣</kbd> = heyra orðið aftur</p>
</div>

<!-- VALMYND -->
<div class="skjar falin" id="valmynd">
  <h1 style="font-size:clamp(1.8rem,5vw,3rem)">Veldu leik</h1>

  <div class="flokkur">📖 Lestur</div>
  <div id="leikjaval">
    <button class="leikjaspjald" id="velja1">
      <span class="nr2">1</span>
      <div class="em">🐶 → <b>H</b></div>
      <div class="nafn">Finndu stafinn</div>
      <div class="lysing">Mynd birtist — veldu rétta stafinn.</div>
    </button>
    <button class="leikjaspjald" id="velja2">
      <span class="nr2">2</span>
      <div class="em"><b>B</b> → 🍌</div>
      <div class="nafn">Finndu myndina</div>
      <div class="lysing">Stafur birtist — veldu myndina sem byrjar á honum.</div>
    </button>
    <button class="leikjaspjald" id="velja3">
      <span class="nr2">3</span>
      <div class="em"><b>bíll</b> → 🚗</div>
      <div class="nafn">Lestu orðið</div>
      <div class="lysing">Orð birtist — lestu það og veldu réttu myndina.</div>
    </button>
  </div>

  <div class="flokkur">🔢 Stærðfræði</div>
  <div id="leikjaval2">
    <button class="leikjaspjald" id="velja4">
      <span class="nr2">4</span>
      <div class="em">3 + 2 = <b>?</b></div>
      <div class="nafn">Plús og mínus</div>
      <div class="lysing">Reiknaðu dæmið og veldu rétta töluna.</div>
    </button>
    <button class="leikjaspjald" id="velja5">

<script>
/* ============ ORÐABANKINN ============ */
const ORD = [
  {o:'api',e:'🐒'}, {o:'appelsína',e:'🍊'}, {o:'álft',e:'🦢'},
  {o:'bíll',e:'🚗'}, {o:'banani',e:'🍌'}, {o:'bátur',e:'⛵'}, {o:'bók',e:'📖'}, {o:'blóm',e:'🌸'},
  {o:'dreki',e:'🐉'},
  {o:'epli',e:'🍎'}, {o:'eldur',e:'🔥'},
  {o:'fiskur',e:'🐟'}, {o:'fugl',e:'🐦'}, {o:'fíll',e:'🐘'},
  {o:'gíraffi',e:'🦒'}, {o:'gulrót',e:'🥕'}, {o:'gítar',e:'🎸'},
  {o:'hundur',e:'🐶'}, {o:'hús',e:'🏠'}, {o:'hestur',e:'🐴'}, {o:'hjarta',e:'❤️'},
  {o:'ís',e:'🍦'}, {o:'íkorni',e:'🐿️'},
  {o:'jarðarber',e:'🍓'}, {o:'jólatré',e:'🎄'},
  {o:'kaka',e:'🍰'}, {o:'kanína',e:'🐰'}, {o:'kýr',e:'🐮'}, {o:'köttur',e:'🐱'}, {o:'krókódíll',e:'🐊'},
  {o:'ljón',e:'🦁'}, {o:'lest',e:'🚂'}, {o:'lykill',e:'🔑'},
  {o:'máni',e:'🌙'}, {o:'mús',e:'🐭'}, {o:'mjólk',e:'🥛'},
  {o:'nál',e:'🪡'}, {o:'nashyrningur',e:'🦏'},
  {o:'ostur',e:'🧀'}, {o:'ormur',e:'🪱'},
  {o:'pera',e:'🍐'}, {o:'penni',e:'🖊️'}, {o:'panda',e:'🐼'},
  {o:'rúta',e:'🚌'}, {o:'refur',e:'🦊'}, {o:'regnbogi',e:'🌈'},
  {o:'sól',e:'☀️'}, {o:'skór',e:'👟'}, {o:'stjarna',e:'⭐'}, {o:'snjókarl',e:'⛄'}, {o:'sími',e:'📱'},
  {o:'tré',e:'🌳'}, {o:'tígrisdýr',e:'🐯'}, {o:'tómatur',e:'🍅'},
  {o:'ugla',e:'🦉'}, {o:'úlfur',e:'🐺'}, {o:'úr',e:'⌚'},
  {o:'vatn',e:'💧'}, {o:'vasi',e:'🏺'},
  {o:'þyrla',e:'🚁'},
  {o:'ær',e:'🐑'}, {o:'önd',e:'🦆'}, {o:'öxi',e:'🪓'}
];

const LIMMIDAR = ['🌟','🍀','🦄','🚀','🍭','🐞','🌺','🎈','🏆','🐳','🍩','⚽','🎨','🦋','🍉','🎁'];

const BORD = [
  { nafn:'Borð 1 — Fyrsti stafurinn', hattur:'fyrsti', throf:10, sia:o=>true,
    hjalp:'Á hvaða staf byrjar orðið?' },
  { nafn:'Borð 2 — Stuttu orðin',    hattur:'stafa',  throf:8,  sia:o=>o.o.length<=4,
    hjalp:'Stafaðu allt orðið!' },
  { nafn:'Borð 3 — Stóru orðin',     hattur:'stafa',  throf:8,  sia:o=>o.o.length>4,
    hjalp:'Þú ert orðinn meistari — stafaðu langa orðið!' }
];

/* ============ STAÐA ============ */
let bordNr = 0, stig = 0, rod = 0, iBordi = 0, mistok = 0;
let nuOrd = null, staða = 0, ordafarvegur = [], laest = false;

const $ = s => document.querySelector(s);
const myndEl=$('#mynd'), ordEl=$('#ord'), hjalpEl=$('#hjalp'), spjaldEl=$('#spjald');

/* ============ HLJÓÐ ============ */
let ac = null;
function hljodvel(){
  if(!ac) ac = new (window.AudioContext||window.webkitAudioContext)();
  if(ac.state === 'suspended') ac.resume();   /* iOS byrjar oft í biðstöðu */
  return ac;
}
function tonn(f, t0, lengd, gerd='sine', styrkur=.18){
  const a = hljodvel(), o = a.createOscillator(), g = a.createGain();
  o.type = gerd; o.frequency.value = f;
  g.gain.setValueAtTime(0, a.currentTime + t0);
  g.gain.linearRampToValueAtTime(styrkur, a.currentTime + t0 + .02);
  g.gain.exponentialRampToValueAtTime(.0001, a.currentTime + t0 + lengd);
  o.connect(g); g.connect(a.destination);
  o.start(a.currentTime + t0); o.stop(a.currentTime + t0 + lengd + .05);
}
const hlj = {
  plopp(){ tonn(880, 0, .12, 'triangle', .14); },
  rett(){ [523,659,784,1047].forEach((f,i)=>tonn(f, i*.075, .25, 'triangle', .16)); },
  rangt(){ tonn(220, 0, .18, 'sine', .10); tonn(165, .1, .22, 'sine', .09); },
  hvarf(){ tonn(700, 0, .10, 'square', .10); tonn(260, .05, .16, 'sine', .09); },
  bord(){ [523,659,784,1047,1319].forEach((f,i)=>tonn(f, i*.11, .5, 'triangle', .18)); }
};

/* ============ TAL ============ */
let raddir = [], islRodd = null;
function finnaRodd(){
  if(!('speechSynthesis' in window)) return;
  raddir = speechSynthesis.getVoices();
  islRodd = raddir.find(r=>/^is/i.test(r.lang)) || null;
}
finnaRodd();
if('speechSynthesis' in window) speechSynthesis.onvoiceschanged = finnaRodd;
function tala(texti, hradi=.85){
  if(!('speechSynthesis' in window) || !islRodd) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(texti);
  u.lang = 'is-IS'; u.rate = hradi; u.pitch = 1.15;
  if(islRodd) u.voice = islRodd;
  speechSynthesis.speak(u);
}

/* ============ SKRAUT ============ */
(function skyBg(){
  const h = $('#himinn'), tákn = ['☁️','⭐','🌈','🎈','☁️','✨'];
  for(let i=0;i<7;i++){
    const s = document.createElement('div');
    s.className='sky'; s.textContent = tákn[i%tákn.length];
    s.style.top = (5 + Math.random()*80) + 'vh';
    s.style.animationDuration = (22 + Math.random()*26) + 's';
    s.style.animationDelay = (-Math.random()*30) + 's';
    h.appendChild(s);
  }
})();

function flugeldar(fjoldi=26){
  const box = $('#agnir');
  for(let i=0;i<fjoldi;i++){
    const a = document.createElement('div');
    a.className='agn';
    a.textContent = LIMMIDAR[Math.floor(Math.random()*LIMMIDAR.length)];
    a.style.left = Math.random()*100 + 'vw';
    a.style.top = '-8vh';
    a.style.fontSize = (1.4 + Math.random()*2.2) + 'rem';
    a.style.animationDuration = (1.6 + Math.random()*1.6) + 's';
    box.appendChild(a);
    setTimeout(()=>a.remove(), 3600);
  }
}

/* ============ LEIKJALÓGÍK ============ */
function stokka(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function byrjaBord(){
  const b = BORD[bordNr];
  ordafarvegur = stokka(ORD.filter(b.sia));
  iBordi = 0;
  $('#bordMerki').textContent = b.nafn.split(' — ')[0];
  naestaOrd();
}

function naestaOrd(){
  if(!ordafarvegur.length) ordafarvegur = stokka(ORD.filter(BORD[bordNr].sia));
  nuOrd = ordafarvegur.pop();
  staða = 0; mistok = 0; laest = false;
  teikna();
  byggjaStafaval();
  hjalpEl.textContent = BORD[bordNr].hjalp;
  setTimeout(()=>tala(nuOrd.o), 260);
}

function teikna(){
  myndEl.textContent = nuOrd.e;
  myndEl.classList.remove('rett');
  ordEl.innerHTML = '';
  const stafir = [...nuOrd.o];
  const hattur = BORD[bordNr].hattur;
  stafir.forEach((s, i)=>{
    const d = document.createElement('div');
    d.className = 'stafur';
    d.textContent = s;
    d.dataset.i = i;
    if(hattur === 'fyrsti'){
      if(i === 0) d.classList.add('reitur','naest');
      else d.classList.add('sest');
    } else {
      d.classList.add('reitur');
      if(i === 0) d.classList.add('naest');
    }
    ordEl.appendChild(d);
  });
}

const STAFROF = [...'aábdðeéfghiíjklmnoóprstuúvyýþæö'];
const TAKKALITIR = ['#ff5fa2','#4d9dff','#2ec4a6','#f7a13c','#9b5de5',
                    '#e8577d','#3aa8e0','#57c964','#ffb703','#7b6bf0'];

function byggjaStafaval(){
  const rett = vaentanlegur().toLowerCase();
  const adrir = stokka(STAFROF.filter(x => x !== rett)).slice(0, 9);
  const valin = stokka([rett, ...adrir]);
  const box = $('#stafaval');
  box.innerHTML = '';
  valin.forEach((st, i)=>{
    const b = document.createElement('button');
    b.className = 'stafatakki';
    b.textContent = st;
    b.dataset.stafur = st;
    b.style.background = TAKKALITIR[i % TAKKALITIR.length];
    b.onclick = ()=>svaraStaf(st);
    box.appendChild(b);
  });
}

function setjaHastafi(a){
  $('#stafaval').classList.toggle('hastafir', a);
  $('#hastafirTakki').classList.toggle('virkur', a);
  const s = $('#hastafirTakki').querySelector('.synid');
  if(s) s.textContent = a ? 'A → a' : 'a → A';
}

function takkiFyrir(st){ return $('#stafaval').querySelector('[data-stafur="' + st + '"]'); }

function svaraStaf(st){
  if(laest) return;
  if(st === vaentanlegur().toLowerCase()) retturStafur();
  else {
    const b = takkiFyrir(st);
    if(b) b.classList.add('rangur');
    rangurStafur();
  }
}

function vaentanlegur(){ return [...nuOrd.o][staða]; }

function retturStafur(){
  const hattur = BORD[bordNr].hattur;
  const el = ordEl.querySelector('[data-i="'+staða+'"]');
  el.classList.remove('reitur','naest','visbending');
  el.classList.add('buid');
  staða++;
  mistok = 0;
  const bui = (hattur === 'fyrsti') || (staða >= [...nuOrd.o].length);
  if(!bui){
    hlj.plopp();
    const n = ordEl.querySelector('[data-i="'+staða+'"]');
    if(n) n.classList.add('naest');
    byggjaStafaval();
    return;
  }
  /* orðið klárað */
  laest = true;
  hlj.rett();
  myndEl.classList.add('rett');
  flugeldar(18);
  stig++; rod++; iBordi++;
  $('#stigin').textContent = '⭐ ' + stig;
  $('#rodin').textContent  = '🔥 ' + rod;
  ordEl.querySelectorAll('.stafur').forEach(s=>{s.className='stafur buid';});
  $('#stafaval').querySelectorAll('.stafatakki').forEach(b=>b.classList.add('rangur'));
  hjalpEl.textContent = ['Frábært! 🎉','Vel gert! 👏','Snilld! 🌟','Þú ert klár! 💪','Rétt! 🥳'][Math.floor(Math.random()*5)];
  tala(nuOrd.o);
  if(stig % 3 === 0) faLimmida();
  uppfaeraFramvindu();

  const b = BORD[bordNr];
  if(iBordi >= b.throf){
    if(bordNr < BORD.length-1) setTimeout(nyttBord, 1500);
    else setTimeout(medaliaSkjar, 1500);
  } else {
    setTimeout(naestaOrd, 1500);
  }
}

function rangurStafur(){
  hlj.rangt();
  rod = 0;
  $('#rodin').textContent = '🔥 0';
  spjaldEl.classList.remove('rangt'); void spjaldEl.offsetWidth;
  spjaldEl.classList.add('rangt');
  mistok++;
  if(mistok >= 2){
    const el = ordEl.querySelector('[data-i="'+staða+'"]');
    if(el) el.classList.add('visbending');
    hjalpEl.textContent = 'Prófaðu stafinn ' + vaentanlegur().toUpperCase() + ' 👀';
    const rb = takkiFyrir(vaentanlegur().toLowerCase());
    if(rb) rb.classList.add('visbending');
    tala(vaentanlegur(), .7);
  } else {
    hjalpEl.textContent = 'Ekki alveg — reyndu aftur! 🙂';
  }
}

function faLimmida(){
  const l = LIMMIDAR[Math.floor(Math.random()*LIMMIDAR.length)];
  const s = document.createElement('span');
  s.textContent = l;
  $('#hilla').appendChild(s);
}

function uppfaeraFramvindu(){
  const b = BORD[bordNr];
  const hlutf = Math.min(100, (iBordi / b.throf) * 100);
  $('#framvindaFyllt').style.width = hlutf + '%';
}

function medaliaSkjar(){
  hlj.bord();
  flugeldar(60);
  iBordi = 0;
  $('#framvindaFyllt').style.width = '0%';
  $('#yfirMynd').textContent = '🥇';
  $('#yfirTexti').innerHTML = 'Þú kláraðir umferð!<br><span style="font-size:.55em">' + stig + ' stig — haltu áfram!</span>';
  $('#yfir').classList.remove('falin');
  tala('Vá! Þú ert lestrarmeistari!', .9);
}

function nyttBord(){
  bordNr++;
  hlj.bord();
  flugeldar(50);
  const b = BORD[bordNr];
  $('#yfirMynd').textContent = '🏆';
  $('#yfirTexti').innerHTML = 'Nýtt borð opnaðist!<br><span style="font-size:.55em">' + b.nafn + '</span>';
  $('#yfir').classList.remove('falin');
  tala('Þú komst á nýtt borð! Frábært!', .9);
  $('#framvindaFyllt').style.width = '0%';
}

/* ============ LEIKUR 2 — finndu myndina / lestu orðið ============ */
let stig2 = 0, rod2 = 0, iBordi2 = 0, laest2 = false;
let rettur2 = null, valListi = [], hamur2 = 'stafur';
const THROF2 = 10;

function byrjaLeik2(h){
  hamur2 = h;
  stig2 = 0; rod2 = 0; iBordi2 = 0;
  $('#stigin2').textContent = '⭐ 0';
  $('#rodin2').textContent  = '🔥 0';
  $('#framvindaFyllt2').style.width = '0%';
  $('#hastafirTakki2').hidden = (h !== 'ord');
  setjaHastafi2(false);
  naestiStafur();
}

function naestiStafur(){
  laest2 = false;
  rettur2 = ORD[Math.floor(Math.random()*ORD.length)];
  const upphaf = [...rettur2.o][0].toLowerCase();

  let truflanir;
  if(hamur2 === 'ord'){
    /* a.m.k. ein truflun byrjar á sama staf, svo það þurfi að lesa allt orðið */
    const somu  = stokka(ORD.filter(o=>o !== rettur2 && [...o.o][0].toLowerCase() === upphaf));
    const adrir = stokka(ORD.filter(o=>o !== rettur2 && [...o.o][0].toLowerCase() !== upphaf));
    truflanir = somu.slice(0,1).concat(adrir).slice(0,3);
  } else {
    const adrir = stokka(ORD.filter(o=>[...o.o][0].toLowerCase() !== upphaf));
    const notadir = new Set([upphaf]);
    truflanir = [];
    for(const o of adrir){
      const b = [...o.o][0].toLowerCase();
      if(notadir.has(b)) continue;
      notadir.add(b); truflanir.push(o);
      if(truflanir.length === 3) break;
    }
  }
  valListi = stokka([rettur2, ...truflanir]);

  if(hamur2 === 'ord'){
    $('#stafspjald').classList.add('ordham');
    synaOrd2();
    $('#hjalp2').textContent = 'Lestu orðið — hvaða mynd passar?';
  } else {
    $('#stafspjald').classList.remove('ordham');
    const stor = Math.random() < .5;
    const bokstafur = stor ? upphaf.toUpperCase() : upphaf;
    $('#storiStafur').textContent = bokstafur;
    $('#baedi').textContent = upphaf.toUpperCase() + ' ' + upphaf;
    $('#hjalp2').textContent = 'Hvaða mynd byrjar á ' + (stor ? 'stórum' : 'litlum') + ' ' + bokstafur + '?';
  }

  const box = $('#valkostir');
  box.innerHTML = '';
  valListi.forEach((o, i)=>{
    const b = document.createElement('button');
    b.className = 'valkostur';
    b.innerHTML = '<span class="nr">' + (i+1) + '</span><span class="emj">' + o.e +
                  '</span><span class="ordtexti">' + o.o + '</span>';
    b.onclick = ()=>velja(i);
    box.appendChild(b);
  });
}

/* halda inni takkanum => orðið birtist með hástöfum */
let hastafir2 = false;
function synaOrd2(){
  if(hamur2 !== 'ord' || !rettur2) return;
  $('#storiStafur').textContent = hastafir2 ? rettur2.o.toUpperCase() : rettur2.o;
}
function setjaHastafi2(a){
  hastafir2 = a;
  const t = $('#hastafirTakki2');
  t.classList.toggle('virkur', a);
  const s = t.querySelector('.synid');
  if(s) s.textContent = a ? 'A → a' : 'a → A';
  synaOrd2();
}

function velja(i){
  if(laest2) return;
  const spjold = [...$('#valkostir').children];
  const val = valListi[i];
  if(val === rettur2){
    laest2 = true;
    hlj.rett();
    flugeldar(18);
    spjold[i].classList.add('rett2','syna');
    stig2++; rod2++; iBordi2++;
    $('#stigin2').textContent = '⭐ ' + stig2;
    $('#rodin2').textContent  = '🔥 ' + rod2;
    $('#framvindaFyllt2').style.width = Math.min(100,(iBordi2/THROF2)*100) + '%';
    $('#hjalp2').textContent = (hamur2 === 'ord')
      ? 'Rétt — þetta er ' + rettur2.o + '! 🎉'
      : rettur2.o.charAt(0).toUpperCase() + rettur2.o.slice(1) +
        ' byrjar á ' + [...rettur2.o][0].toUpperCase() + '! 🎉';
    if(stig2 % 3 === 0) faLimmida();
    tala(rettur2.o);
    if(iBordi2 >= THROF2){
      iBordi2 = 0;
      setTimeout(()=>{
        hlj.bord(); flugeldar(60);
        $('#framvindaFyllt2').style.width = '0%';
        $('#yfirMynd').textContent = '🥇';
        $('#yfirTexti').innerHTML = 'Frábært!<br><span style="font-size:.55em">' + stig2 + ' stig — haltu áfram!</span>';
        $('#yfir').classList.remove('falin');
      }, 1400);
    } else {
      setTimeout(naestiStafur, 1600);
    }
  } else {
    hlj.rangt();
    rod2 = 0;
    $('#rodin2').textContent = '🔥 0';
    spjold[i].classList.add('rangt2','syna');
    spjold[i].onclick = null;
    $('#hjalp2').textContent = (hamur2 === 'ord')
      ? 'Þetta er ' + val.o + ' — reyndu aftur! 🙂'
      : val.o.charAt(0).toUpperCase() + val.o.slice(1) + ' byrjar á ' +
        [...val.o][0].toUpperCase() + ' — reyndu aftur! 🙂';
  }
}

/* ============ LEIKUR 3 — plús og mínus ============ */
let stig3 = 0, rod3 = 0, iBordi3 = 0, laest3 = false;
let hamur3 = 'daemi', hamark3 = 5, svar3 = 0;
const THROF3 = 8;
const HAMORK  = [5, 10, 15, 20];
const HLUTIR  = ['🍎','🍌','⭐','🐟','🎈','🍓','🐞','🍪','🌸','🚗','🦆','🐝'];
const TOLULITIR = ['#ff5fa2','#4d9dff','#2ec4a6','#f7a13c','#9b5de5','#e8577d',
                   '#3aa8e0','#57c964','#ffb703','#7b6bf0','#ef6b6b'];

const LEIKJANOFN = {
  daemi:  'Plús og mínus',
  myndir: 'Teldu hlutina',
  vantar: 'Hvað vantar?'
};

function byrjaLeik3(h){
  hamur3 = h;
  stig3 = 0; rod3 = 0; iBordi3 = 0; hamark3 = HAMORK[0];
  $('#stigin3').textContent = '⭐ 0';
  $('#rodin3').textContent  = '🔥 0';
  $('#framvindaFyllt3').style.width = '0%';
  nyttDaemi();
}

function nyttDaemi(){
  laest3 = false;
  const plus = Math.random() < .5;
  let a, b, c;
  if(plus){
    c = 2 + Math.floor(Math.random() * (hamark3 - 1));   /* 2..hamark */
    a = 1 + Math.floor(Math.random() * (c - 1));         /* 1..c-1   */
    b = c - a;
  } else {
    a = 2 + Math.floor(Math.random() * (hamark3 - 1));   /* 2..hamark */
    b = 1 + Math.floor(Math.random() * a);               /* 1..a     */
    c = a - b;
  }
  const tak = plus ? '+' : '−';

  const myndir = $('#daemiMyndir');
  myndir.innerHTML = '';
  myndir.style.display = (hamur3 === 'myndir') ? 'flex' : 'none';

  if(hamur3 === 'vantar'){
    svar3 = b;
    $('#daemiTexti').innerHTML = a + ' ' + tak + ' <span class="spurn">?</span> = ' + c;
    $('#hjalp3').textContent = 'Hvaða tala vantar?';
  } else {
    svar3 = c;
    $('#daemiTexti').innerHTML = a + ' ' + tak + ' ' + b + ' = <span class="spurn">?</span>';
    $('#hjalp3').textContent = plus ? 'Leggðu saman!' : 'Dragðu frá!';
  }

  if(hamur3 === 'myndir'){
    const hlutur = HLUTIR[Math.floor(Math.random() * HLUTIR.length)];
    if(plus){
      myndir.appendChild(hopur(hlutur, a, 0));
      myndir.appendChild(adgerd('+'));
      myndir.appendChild(hopur(hlutur, b, 0));
    } else {
      myndir.appendChild(hopur(hlutur, a, b));
      myndir.appendChild(adgerd('−' + b));
    }
  }

  byggjaTolur('#tolur', hamark3, svaraTolu);
}

function hopur(hlutur, fjoldi, burt){
  const d = document.createElement('div');
  d.className = 'hopur';
  for(let i = 0; i < fjoldi; i++){
    const sp = document.createElement('span');
    sp.textContent = hlutur;
    if(i >= fjoldi - burt) sp.className = 'burt';
    d.appendChild(sp);
  }
  return d;
}
function adgerd(t){
  const d = document.createElement('div');
  d.className = 'adgerd';
  d.textContent = t;
  return d;
}

function byggjaTolur(sel, hamark, vidbragd){
  const box = $(sel);
  box.innerHTML = '';
  for(let n = 0; n <= hamark; n++){
    const b = document.createElement('button');
    b.className = 'tolutakki';
    b.textContent = n;
    b.dataset.tala = n;
    b.style.background = TOLULITIR[n % TOLULITIR.length];
    b.onclick = ()=>vidbragd(n);
    box.appendChild(b);
  }
}

function svaraTolu(n){
  if(laest3) return;
  const b = $('#tolur').querySelector('[data-tala="' + n + '"]');
  if(n === svar3){
    laest3 = true;
    hlj.rett();
    flugeldar(18);
    if(b) b.classList.add('rett3');
    $('#daemiTexti').innerHTML = $('#daemiTexti').innerHTML.replace(
      /<span class="spurn">\?<\/span>/, '<span class="spurn">' + n + '</span>');
    stig3++; rod3++; iBordi3++;
    $('#stigin3').textContent = '⭐ ' + stig3;
    $('#rodin3').textContent  = '🔥 ' + rod3;
    $('#framvindaFyllt3').style.width = Math.min(100, (iBordi3 / THROF3) * 100) + '%';
    $('#hjalp3').textContent = ['Rétt! 🎉','Frábært! 👏','Snilld! 🌟','Þú ert klár! 💪'][Math.floor(Math.random()*4)];
    if(stig3 % 3 === 0) faLimmida();

    if(iBordi3 >= THROF3){
      iBordi3 = 0;
      const naest = HAMORK[Math.min(HAMORK.indexOf(hamark3) + 1, HAMORK.length - 1)];
      const staekkar = naest !== hamark3;
      hamark3 = naest;
      setTimeout(()=>{
        hlj.bord(); flugeldar(60);
        $('#framvindaFyllt3').style.width = '0%';
        $('#yfirMynd').textContent = '🏆';
        $('#yfirTexti').innerHTML = (staekkar ? 'Nú koma stærri tölur!' : 'Frábært!') +
          '<br><span style="font-size:.55em">' + stig3 + ' stig — haltu áfram!</span>';
        $('#yfir').classList.remove('falin');
      }, 1300);
    } else {
      setTimeout(nyttDaemi, 1400);
    }
  } else {
    hlj.rangt();
    rod3 = 0;
    $('#rodin3').textContent = '🔥 0';
    if(b) b.classList.add('rangur');
    const sp = $('#daemispjald');
    sp.classList.remove('rangt'); void sp.offsetWidth; sp.classList.add('rangt');
    $('#hjalp3').textContent = n > svar3 ? 'Aðeins of hátt — reyndu lægri tölu 🙂'
                                        : 'Aðeins of lágt — reyndu hærri tölu 🙂';
  }
}

/* ============ LEIKUR 4 — sagan (teldu það sem eftir er) ============ */
let stig4 = 0, rod4 = 0, iBordi4 = 0, laest4 = true;
let hamark4 = 5, svar4 = 0, sogumerki = 0;
const THROF4 = 8;

const SOGUR = [
  {h:'🎈', nafn:'blöðrur',   burt:'sprungu!',      hreyf:'springa', tak:'💥'},
  {h:'🍎', nafn:'epli',      burt:'voru borðuð!',  hreyf:'borda',   tak:'😋'},
  {h:'🍪', nafn:'smákökur',  burt:'voru étnar!',   hreyf:'borda',   tak:'😋'},
  {h:'🍓', nafn:'jarðarber', burt:'voru borðuð!',  hreyf:'borda',   tak:'😋'},
  {h:'🐦', nafn:'fuglar',    burt:'flugu burt!',   hreyf:'burt',    tak:'💨'},
  {h:'🐟', nafn:'fiskar',    burt:'syntu burt!',   hreyf:'burt',    tak:'💨'},
  {h:'🚗', nafn:'bílar',     burt:'keyrðu burt!',  hreyf:'burt',    tak:'💨'},
  {h:'🐝', nafn:'býflugur',  burt:'flugu burt!',   hreyf:'burt',    tak:'💨'},
  {h:'🦆', nafn:'endur',     burt:'syntu burt!',   hreyf:'burt',    tak:'💨'},
  {h:'⭐', nafn:'stjörnur',  burt:'slokknuðu!',    hreyf:'hverfa',  tak:'✨'}
];

const bida = ms => new Promise(r => setTimeout(r, ms));

function byrjaLeik4(){
  stig4 = 0; rod4 = 0; iBordi4 = 0; hamark4 = HAMORK[0];
  $('#stigin4').textContent = '⭐ 0';
  $('#rodin4').textContent  = '🔥 0';
  $('#framvindaFyllt4').style.width = '0%';
  nySaga();
}

let saga4 = null;   /* {sv, plus, a, b} — geymt svo hægt sé að sjá söguna aftur */

function jafnaBaeta(t, spurn){
  const j = $('#jafna');
  if(!j.querySelector('span')) j.innerHTML = '';
  const sp = document.createElement('span');
  if(spurn) sp.className = 'spurn';
  sp.textContent = t;
  j.appendChild(sp);
}

function nySaga(){
  const sv = SOGUR[Math.floor(Math.random() * SOGUR.length)];
  const plus = Math.random() < .5;
  let a, b;
  if(plus){
    const c = 4 + Math.floor(Math.random() * (hamark4 - 3));  /* 4..hamark */
    a = 2 + Math.floor(Math.random() * (c - 3));              /* 2..c-2   */
    b = c - a;
    svar4 = c;
  } else {
    a = 3 + Math.floor(Math.random() * (hamark4 - 2));        /* 3..hamark */
    b = 2 + Math.floor(Math.random() * (a - 2));              /* 2..a-1   */
    svar4 = a - b;
  }
  saga4 = {sv, plus, a, b};
  spilaSogu();
}

async function spilaSogu(){
  const merki = ++sogumerki;
  const {sv, plus, a, b} = saga4;
  laest4 = true;
  const svid = $('#svidHlutir');
  svid.innerHTML = '';
  $('#tolur4').innerHTML = '';
  $('#jafna').innerHTML = '&nbsp;';
  $('#saga').innerHTML = '&nbsp;';
  $('#sjaAftur').classList.add('falin');
  $('#hjalp4').textContent = 'Fylgstu með…';

  /* 1. hlutirnir birtast einn og einn í fyrsta hópnum */
  const hopA = document.createElement('div');
  hopA.className = 'svidhopur';
  svid.appendChild(hopA);
  for(let i = 0; i < a; i++){
    if(merki !== sogumerki) return;
    const sp = document.createElement('span');
    sp.className = 'birtast';
    sp.textContent = sv.h;
    hopA.appendChild(sp);
    hlj.plopp();
    await bida(150);
  }
  if(merki !== sogumerki) return;
  jafnaBaeta(a);
  $('#hjalp4').textContent = a + ' ' + sv.nafn + '!';
  await bida(800);
  if(merki !== sogumerki) return;

  /* 2. eitthvað gerist */
  if(plus){
    const badge = document.createElement('div');
    badge.className = 'svidadgerd birtast';
    badge.textContent = '+';
    const hopB = document.createElement('div');
    hopB.className = 'svidhopur nyr';
    const par = document.createElement('div');   /* plúsinn brotnar með hópnum */
    par.className = 'svidpar';
    par.appendChild(badge);
    par.appendChild(hopB);
    svid.appendChild(par);
    jafnaBaeta('+');
    $('#saga').textContent = '➕ ' + b + ' ' + sv.nafn + ' bættust við!';
    for(let i = 0; i < b; i++){
      const sp = document.createElement('span');
      sp.className = 'koma';
      sp.textContent = sv.h;
      hopB.appendChild(sp);
      hlj.plopp();
      await bida(220);
      if(merki !== sogumerki) return;
    }
    jafnaBaeta(b);
    $('#hjalp4').textContent = 'Teldu alla saman!';
  } else {
    jafnaBaeta('−');
    $('#saga').textContent = sv.tak + ' ' + b + ' ' + sv.nafn + ' ' + sv.burt;
    const born = [...hopA.children];
    for(let i = 0; i < b; i++){
      const sp = born[born.length - 1 - i];
      if(!sp) continue;
      sp.classList.add(sv.hreyf);
      if(sv.hreyf === 'springa') setTimeout(()=>{ sp.textContent = '💥'; }, 200);
      hlj.hvarf();
      await bida(260);
      if(merki !== sogumerki) return;
    }
    await bida(700);
    if(merki !== sogumerki) return;
    /* þeir sem fóru verða gráir og krossaðir í stað þess að hverfa,
       svo frádrátturinn sjáist áfram á sviðinu */
    born.slice(born.length - b).forEach(sp=>{
      sp.className = 'farinn';
      sp.textContent = sv.h;
    });
    jafnaBaeta(b);
    $('#hjalp4').textContent = 'Teldu þá sem eru eftir!';
  }

  /* 3. dæmið klárast og svarað */
  await bida(500);
  if(merki !== sogumerki) return;
  jafnaBaeta('=');
  jafnaBaeta('?', true);
  laest4 = false;
  byggjaTolur('#tolur4', hamark4, svaraSogu);
  $('#sjaAftur').classList.remove('falin');
}

function svaraSogu(n){
  if(laest4) return;
  const b = $('#tolur4').querySelector('[data-tala="' + n + '"]');
  if(n === svar4){
    laest4 = true;
    hlj.rett();
    flugeldar(18);
    if(b) b.classList.add('rett3');
    stig4++; rod4++; iBordi4++;
    $('#stigin4').textContent = '⭐ ' + stig4;
    $('#rodin4').textContent  = '🔥 ' + rod4;
    $('#framvindaFyllt4').style.width = Math.min(100, (iBordi4 / THROF4) * 100) + '%';
    $('#hjalp4').textContent = 'Rétt — ' + n + '! 🎉';
    const q = $('#jafna').querySelector('.spurn');
    if(q) q.textContent = n;
    $('#sjaAftur').classList.add('falin');
    if(stig4 % 3 === 0) faLimmida();

    if(iBordi4 >= THROF4){
      iBordi4 = 0;
      const naest = HAMORK[Math.min(HAMORK.indexOf(hamark4) + 1, HAMORK.length - 1)];
      const staekkar = naest !== hamark4;
      hamark4 = naest;
      setTimeout(()=>{
        hlj.bord(); flugeldar(60);
        $('#framvindaFyllt4').style.width = '0%';
        $('#yfirMynd').textContent = '🏆';
        $('#yfirTexti').innerHTML = (staekkar ? 'Nú koma fleiri hlutir!' : 'Frábært!') +
          '<br><span style="font-size:.55em">' + stig4 + ' stig — haltu áfram!</span>';
        $('#yfir').classList.remove('falin');
      }, 1300);
    } else {
      setTimeout(nySaga, 1500);
    }
  } else {
    hlj.rangt();
    rod4 = 0;
    $('#rodin4').textContent = '🔥 0';
    if(b) b.classList.add('rangur');
    $('#hjalp4').textContent = 'Teldu aftur — ' +
      (n > svar4 ? 'það er færra en það 🙂' : 'það er fleira en það 🙂');
  }
}

/* ============ SKJÁSTÝRING ============ */
function syna(id){
  ['upphaf','valmynd','leikur','leikur2','leikur3','leikur4'].forEach(x=>$('#'+x).classList.add('falin'));
  $('#'+id).classList.remove('falin');
}
function opnaValmynd(){
  $('#yfir').classList.add('falin');
  syna('valmynd');
}
function byrja(){
  hljodvel();
  opnaValmynd();
}
function lokaYfir(){
  $('#yfir').classList.add('falin');
  if(!$('#leikur2').classList.contains('falin')) naestiStafur();
  else if(!$('#leikur3').classList.contains('falin')) nyttDaemi();
  else if(!$('#leikur4').classList.contains('falin')) nySaga();
  else byrjaBord();
}

$('#byrjaTakki').addEventListener('click', byrja);
$('#yfirTakki').addEventListener('click', lokaYfir);
$('#velja1').onclick = ()=>{ hljodvel(); syna('leikur');  bordNr = 0; stig = 0; rod = 0; byrjaBord(); };
$('#velja2').onclick = ()=>{ hljodvel(); syna('leikur2'); byrjaLeik2('stafur'); };
$('#velja3').onclick = ()=>{ hljodvel(); syna('leikur2'); byrjaLeik2('ord'); };
$('#velja4').onclick = ()=>{ hljodvel(); syna('leikur3'); byrjaLeik3('daemi');  };
$('#velja5').onclick = ()=>{ hljodvel(); syna('leikur3'); byrjaLeik3('myndir'); };
$('#velja6').onclick = ()=>{ hljodvel(); syna('leikur3'); byrjaLeik3('vantar'); };
$('#velja7').onclick = ()=>{ hljodvel(); syna('leikur4'); byrjaLeik4(); };
$('#tilbakaMerki3').onclick = opnaValmynd;
$('#tilbakaMerki4').onclick = ()=>{ sogumerki++; opnaValmynd(); };
$('#sjaAftur').onclick = e=>{ e.currentTarget.blur(); if(saga4) spilaSogu(); };
$('#tilbakaMerki').onclick  = opnaValmynd;
$('#tilbakaMerki1').onclick = opnaValmynd;
$('#storiStafur').parentElement.addEventListener('click', ()=>{ if(rettur2) tala(rettur2.o); });

/* ============ INNSLÁTTUR ============ */
document.addEventListener('keydown', e=>{
  /* upphafsskjár */
  if(!$('#upphaf').classList.contains('falin')){
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); byrja(); }
    return;
  }
  /* verðlaunaskjár */
  if(!$('#yfir').classList.contains('falin')){
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); lokaYfir(); }
    return;
  }
  /* valmynd: 1 eða 2 velur leik */
  if(!$('#valmynd').classList.contains('falin')){
    ['1','2','3','4','5','6','7'].forEach((k, i)=>{ if(e.key === k) $('#velja' + (i+1)).click(); });
    return;
  }
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  if(e.key === 'Escape'){ opnaValmynd(); return; }

  /* leikur 4: tölutakkar svara */
  if(!$('#leikur4').classList.contains('falin')){
    const n = parseInt(e.key, 10);
    if(!isNaN(n) && n >= 0 && n <= hamark4) svaraSogu(n);
    return;
  }

  /* leikur 3: tölutakkar svara */
  if(!$('#leikur3').classList.contains('falin')){
    const n = parseInt(e.key, 10);
    if(!isNaN(n) && n >= 0 && n <= hamark3) svaraTolu(n);
    return;
  }

  /* leikur 2: 1-4 velja mynd */
  if(!$('#leikur2').classList.contains('falin')){
    if(e.key === ' '){ e.preventDefault(); if(rettur2) tala(rettur2.o); return; }
    const n = parseInt(e.key, 10);
    if(n >= 1 && n <= 4) velja(n-1);
    return;
  }

  /* leikur 1: sláðu inn stafinn */
  if(e.key === ' '){ e.preventDefault(); tala(nuOrd.o); return; }
  if([...e.key].length !== 1) return;
  if(laest) return;
  const inn = e.key.toLowerCase();
  if(inn === vaentanlegur().toLowerCase() || /[a-záðéíóúýþæö]/i.test(inn)) svaraStaf(inn);
});

/* halda inni takkann (eða Shift) => stafavalið verður hástafir */
const hastTakki = $('#hastafirTakki');
hastTakki.addEventListener('pointerdown', e=>{ e.preventDefault(); setjaHastafi(true); });
['pointerup','pointerleave','pointercancel'].forEach(v=>
  hastTakki.addEventListener(v, ()=>setjaHastafi(false)));
const hastTakki2 = $('#hastafirTakki2');
hastTakki2.addEventListener('pointerdown', e=>{ e.preventDefault(); setjaHastafi2(true); });
['pointerup','pointerleave','pointercancel'].forEach(v=>
  hastTakki2.addEventListener(v, ()=>setjaHastafi2(false)));
document.addEventListener('keydown', e=>{ if(e.key === 'Shift'){ setjaHastafi(true); setjaHastafi2(true); } });
document.addEventListener('keyup',   e=>{ if(e.key === 'Shift'){ setjaHastafi(false); setjaHastafi2(false); } });
window.addEventListener('blur', ()=>{ setjaHastafi(false); setjaHastafi2(false); });

myndEl.addEventListener('click', ()=>{ if(nuOrd) tala(nuOrd.o); });
